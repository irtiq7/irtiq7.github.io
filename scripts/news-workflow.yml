# Copy this file to .github/workflows/news.yml (GitHub's web editor works), then run it once from the Actions tab.
# Rebuilds the AI news data once a day: news/latest.json, news/trends.json and the slim news/archive/ copy.
# See scripts/build-news.js and news/sources.json.
name: Build news

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: scripts
      - name: Build news
        run: node scripts/build-news.js
      - name: Commit and push if changed
        run: |
          if [ -z "$(git status --porcelain -- news)" ]; then
            echo "News unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news
          git commit -m "Update news"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
