# Keeps the JavaScript-free copies of the guestbook and article lists up to date for AI agents.
# See scripts/build-agent-snapshot.js. Commits only when something changed.
name: Agent snapshot

on:
  issues:
    types: [opened, edited, deleted, closed, reopened, labeled, unlabeled]
  issue_comment:
    types: [created, deleted]
  push:
    branches: [main]
    paths: ["posts/**"]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: agent-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build snapshot
        run: node scripts/build-agent-snapshot.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit and push if changed
        run: |
          if [ -z "$(git status --porcelain -- guestbook.json guestbook-stats.json guestbook.html articles.html llms.txt)" ]; then
            echo "Snapshot unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guestbook.json guestbook-stats.json guestbook.html articles.html llms.txt
          git commit -m "Update agent snapshot"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
